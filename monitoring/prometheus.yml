# Prometheus configuration for net-assurance-lab (local, loopback only).
#
# Start (after downloading a Prometheus binary, see README "Monitoring"):
#   ./prometheus --config.file=monitoring/prometheus.yml \
#       --storage.tsdb.path=/tmp/nal-prom-data \
#       --web.listen-address=127.0.0.1:9090
#
# The exporter is a plain HTTP target; no service discovery is needed
# because everything in this lab is pinned to 127.0.0.1 by design.

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers: []
  # No Alertmanager is wired up for the local bench: alerts are meant
  # to be observed on Prometheus' own /alerts page and via the API.
  # To route them, add an alertmanager target here (127.0.0.1:9093).

scrape_configs:
  - job_name: "net-assurance-lab"
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9108"]
        labels:
          lab: "net-assurance-lab"
          env: "local-loopback"

  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]
